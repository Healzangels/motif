<!-- ============================ PASSWORD ============================ -->
<section class="block tab-panel" data-panel="password" style="display:none">
  <header class="block-head">
    <h2 class="block-title">// CHANGE PASSWORD</h2>
    <span class="muted small">tune your own credentials</span>
  </header>
  <div class="block-body">
    <form id="password-form" class="form-grid">
      {# v0.50.51: hidden username field — satisfies Chrome's "password forms
         should have a (hidden) username field" accessibility check and lets a
         password manager associate the credential. The /api/admin/password
         endpoint reads only current_password / new_password (typed Form params),

             aria-hidden="true" tabindex="-1" hidden />

        <span class="field-name">NEW PASSWORD</span>

          <input class="input" name="new_password" type="password" required minlength="8" maxlength="128"
                 autocomplete="new-password" />
          <p class="form-hint">8 to 128 characters.</p>
        </span>
      </label>
      <div class="form-actions">
        <button type="submit" class="btn btn-warn">// UPDATE PASSWORD</button>
        <span id="password-status" class="form-status"></span>
      </div>

<section class="block tab-panel" data-panel="homepage" style="display:none">

    <span class="muted small">expose stats to your dashboard</span>
  </header>
  <div class="block-body">
    <p class="form-hint block-intro">

      string):

  type: customapi
  url: https://motif.example.com/api/public/stats

  display: list

  mappings:
    - field: movies_downloaded

      format: number
    - field: tv_downloaded
      label: TV w/ themes
      format: number

    - field: storage_copies_bytes

      format: bytes</pre>

<!-- ============================ IMPORT ============================ -->
<!-- v1.15.66: bulk CSV import for user URLs. Pairs with the
     per-library // EXPORT CSV button (which now emits a
     Title,IMDB,Youtube_URL header). Preview-first workflow:
     parse → match by IMDB (then title+year fallback for missing
     IMDB) → categorize each row (CLEAN / CONFLICT / NO MATCH /
     SKIPPED) → user resolves conflicts in-page → APPLY. No
     orphan pending state; no new tone/flag column. -->
<section class="block tab-panel" data-panel="import" style="display:none">
  <header class="block-head">
    <h2 class="block-title">// IMPORT</h2>
    <span class="muted small">bulk user-url CSV — round-trip from // EXPORT CSV</span>
  </header>
  <div class="block-body">
    {# v1.15.71: concise intro re-added in the standard settings
       block-intro style. the user's v1.15.70 ask: "lets provide
       some clear information on the tip explaining the import
       feature ... use the same style/format as our other
       sections in settings." Two sentences max, plain English,
       no narration. The v1.15.66 intro that was retired in
       v1.15.69 was 4 lines of sub-clauses — this one is the
       what + how + verify-link. #}
    <p class="form-hint block-intro">
      Bulk-apply user-provided YouTube URLs from a CSV. Round-trip
      with any library tab's <code>// EXPORT CSV</code>: open the
      file, fill in the <code>Youtube_URL</code> cells, drop it
      back here. Preview shows what each row would do; nothing
      writes until you click <code>// APPLY IMPORT</code>.
    </p>
    {# v1.19.25 (reverts v1.15.73): re-wrapped CSV FILE row in
       a <label> so clicking anywhere on the row activates the
       file picker. v1.15.73 removed the label after the user's
       earlier complaint that clicking the heading opened the
       file dialog as a footgun. v1.19.25 reverses that: the user
       compared this to the theme upload modal (which uses a
       <label> wrapper) and said "I like how the theme upload
       functions/click area" — wants the same UX on /settings.
       Two-axis preference flip across ~4 years; document both
       directions so the next swap is informed. #}
    <div class="form-grid">
      {# v1.19.39: dropped `for="import-csv-file"` so the label
         wraps the input via direct nesting only. DESIGN_SYSTEM.md
         § 2 form layout (updated v1.19.36) says no `for=`
         attribute when the input is a direct child — matches the
         sibling shape at library.html:659 upload-dlg. Pre-fix the
         settings file input carried `for=` while library's
         didn't; the v1.19.36 doc update silently lied about
         codebase consistency. v1.15.70/.73 banned `for=` here
         because clicking label-text popped the picker before the
         user read the hint; v1.19.25 reversed the wrap-direction
         decision but v1.19.39 closes the leftover attribute. #}
      <label class="field-row">
        <span class="field-name">CSV FILE</span>
        <span class="field-control">
          <input class="input" id="import-csv-file" type="file" accept=".csv,text/csv" />
        </span>
      </label>
      <div class="form-input-actions">
        {# v1.19.25 (reverts v1.15.76): standard green .btn tone.
           v1.15.76 colored this violet to group with the U-row
           palette (since CSV imports populate user_overrides).
           the user on v1.19.24: "can we also change the preview
           import button back to the standard button color."
           Drops the lib-source-user modifier — button reverts
           to default green outlined. The intent grouping with
           U-source is gone visually, but the page header +
           muted intro paragraph still anchor the workflow's
           identity. #}
        <button class="btn btn-tiny" id="import-preview-btn"
                type="button" disabled>// PREVIEW IMPORT</button>
        <span class="muted small" id="import-preview-status"></span>
      </div>
    </div>

    <div id="import-preview-results" style="display:none">
      <header class="block-head" style="margin-top:var(--gap-6)">
        <h3 class="block-title">// PREVIEW RESULTS</h3>
        <span class="muted small" id="import-preview-summary">—</span>
      </header>
      <!-- v1.15.68: completion banner. After // APPLY IMPORT
           lands successfully, hide the preview table and show
           this prominent confirmation. the user's v1.15.67
           feedback: "currently its hard to tell the action
           happened and is completed successfully" — the inline
           status text was easy to miss. // IMPORT ANOTHER
           resets the file picker for a follow-up CSV. -->
      <div id="import-apply-complete" class="apply-complete-banner" style="display:none">
        <h3 class="apply-complete-title">// ✓ IMPORT COMPLETE</h3>
        <p class="apply-complete-counts">
          <strong id="import-complete-applied">0</strong> applied ·
          <strong id="import-complete-skipped">0</strong> skipped<span
            id="import-complete-errors-wrap" style="display:none"
            > · <strong id="import-complete-errors">0</strong> errors</span>
        </p>
        <p class="form-hint">
          User URLs were written to <code>user_overrides</code>; downloads
          have been queued. Check the affected library tab (MOVIES /
          TV SHOWS / ANIME) to verify the SRC pill flipped to <code>U</code>.
        </p>
        <button class="btn btn-tiny" id="import-complete-reset" type="button">// IMPORT ANOTHER</button>
      </div>
      <!-- v1.15.69: rebuilt to mirror library.html's .table layout.
           The v1.15.66 markup used class="grid" + class="table-wrap"
           which I'd invented — but .grid is `display: grid` in
           app.css (a CSS Grid container), which OVERRIDES the
           native `display: table` on a <table> element. Result:
           the <thead> row's <th>s rendered as grid cells, all
           squished onto one line below the master checkbox; the
           <tbody> rows used different sizing so columns didn't
           align with headers. the user: "rows below are smooshed
           together. The - And the U are connected right next to
           the imdb." Switching to .table + the library's column-
           class pattern (.col-state for fixed-width checkbox col,
           etc.) makes the import preview render with the same
           polish as /movies, /tv, /anime.
           The verbose hint paragraph + the master-checkbox
           tooltip are gone — the user: "overly verbose and not
           overly helpful." The bare checkbox with a short title
           tooltip is enough now that columns actually align. -->
      {# v0.50.88: 7-column table (STATUS/TITLE/IMDB/CURRENT/IMPORTED URL/
         ACTION, several with fixed-px widths in app.css) had no scroll
         context — same class of bug as the v0.50.87 TOKENS/LIBRARY SECTIONS
         fix, just missed on this table then. Same .table-scroll wrapper. #}
      <div class="table-scroll">
      <table class="table table-tight" id="import-preview-table">
        <thead>
          <tr>
            <th class="col-state" title="Select / deselect all applicable rows.">
              <input type="checkbox" id="import-row-select-all" checked>
            </th>
            <th class="col-import-status">STATUS</th>
            <th class="col-title">TITLE</th>
            <th class="col-imdb">IMDB</th>
            <th class="col-import-current">CURRENT</th>
            <th class="col-import-url">IMPORTED URL</th>
            <th class="col-import-action">ACTION</th>
          </tr>
        </thead>
        <tbody id="import-preview-tbody"></tbody>
      </table>
      </div>{# /.table-scroll #}
      <div class="form-actions" style="margin-top:var(--gap-4)">
        <button class="btn btn-tiny btn-warn" id="import-apply-btn" type="button">// APPLY IMPORT</button>
        <span class="muted small" id="import-apply-status"></span>
      </div>
    </div>
  </div>
</section>

<dialog class="dlg" id="new-token-dlg">
  {# v1.17.8: refactored to match the canonical dialog shell that
     info-dlg / upload-dlg / manual-url-dlg use:
     - <header class="dlg-head"> wrapping <h2 class="dlg-title">
       (was a bare <h3> with no class)
     - "// NEW API TOKEN" with the // prefix every other dialog
       title carries
     - .dlg-close lives INSIDE the header (was a direct child of
       .dlg-body, triggering the .dlg-body > .dlg-close absolute-
       corner variant — only consumer; retired this tag)
     - // CANCEL button in form-actions (was missing — user could
       only close via × glyph or Escape)
     - Bare <label class="form-label"> instead of nested
       form-label-row (settings-page convention — not needed in
       dialog forms; matches the library-dialog convention) #}
  <article class="dlg-body">
    <header class="dlg-head">
      <h2 class="dlg-title">// NEW API TOKEN</h2>
      <button class="dlg-close" data-close type="button" aria-label="Close dialog" title="Close">×</button>
    </header>
    <form id="new-token-form" class="form-grid form-grid-tight">
      <label class="form-label">
        <span class="form-label-text">NAME</span>
        <input class="input" name="name" required maxlength="64" placeholder="e.g. homepage-dashboard" autofocus />
      </label>
      <label class="form-label">
        <span class="form-label-text">SCOPE</span>
        <select class="input" name="scope">
          <option value="read" selected>read — stats &amp; browse only</option>
          <option value="admin">admin — full access (re-download, override, sync)</option>
        </select>
      </label>
      <div class="form-actions">
        <button type="submit" class="btn btn-warn">// CREATE</button>
        <button type="button" class="btn" data-close>// CANCEL</button>
      </div>
    </form>
    <div id="new-token-result" class="new-token-result" style="display:none">
      <h4 class="new-token-warn">SAVE THIS NOW — IT WON'T BE SHOWN AGAIN</h4>
      <pre class="codeblock" id="new-token-value"></pre>
      <p class="form-hint">
        Use as <code>Authorization: Bearer &lt;token&gt;</code> or
        <code>?api_key=&lt;token&gt;</code>.
      </p>
    </div>
  </article>
</dialog>
{% endblock %}
