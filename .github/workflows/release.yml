name: release

# Triggered on git tags v* (e.g. v1.3.0). Builds multi-arch images and pushes
# to Docker Hub at healzangels/motif with version-based tags.
#
# REQUIRED REPO SECRETS:
#   DOCKERHUB_USERNAME — your Docker Hub username (healzangels)
#   DOCKERHUB_TOKEN    — a Docker Hub access token (Account Settings → Security)
#
# Tag conventions:
#   git tag -a v1.3.0 -m "release 1.3.0" && git push origin v1.3.0
# This produces image tags:
#   healzangels/motif:1.3.0   (exact, immutable version)
#   healzangels/motif:nightly (rolling pointer to the newest build)
# 0.50.0: dropped the rolling major/minor floats and renamed the moving
# tag latest → nightly. nightly is the active channel deployments track;
# there is no `latest`.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. 1.3.0) — for manual builds without a git tag'
        required: true
        default: '0.0.0-dev'

env:
  IMAGE_NAME: healzangels/motif
  # v1.15.0: opt every JS-based action into Node.js 24 now. GitHub
  # is force-upgrading from Node.js 20 → 24 starting June 2nd, 2026
  # (Node 20 removed Sept 16th, 2026); the deprecation warning was
  # appearing on every build. Opting in early surfaces any
  # incompatibility before the forced cutover instead of after.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # v0.51.267: the publish gate. Pre-tag release.yml ran NO tests and depended on
  # no CI result — it assumed "a branch push already ran ci.yml for this commit",
  # which is a process assumption, not an enforcement. ci.yml deliberately skips
  # tags, and workflow_dispatch can publish any commit at all, so a red tree could
  # reach :nightly — the channel every deployment tracks. This re-runs the two
  # BLOCKING gates from ci.yml against the exact tagged source; build-and-push
  # needs it, so a failure means nothing is published.
  gate:
    name: publish gate — pytest + ruff correctness (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches the Dockerfile runtime
          cache: pip
      - name: install deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest — full suite (BLOCKING)
        run: PYTHONPATH=$PWD pytest -q -p no:cacheprovider
      - name: ruff — pyflakes correctness (BLOCKING)
        run: ruff check app/ tests/ --select F --ignore F401,F811,F841,F541
      - name: pip-audit — dependency CVEs (BLOCKING)
        run: pip-audit -r requirements.txt

  build-and-push:
    name: build and push multi-arch image
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.tag }}"
          else
            # Strip leading 'v' from git tag
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          # Validate semver-ish: MAJOR.MINOR.PATCH (extra suffixes allowed for pre-release)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::Tag '$VERSION' is not semver-compatible (expected MAJOR.MINOR.PATCH)"
            exit 1
          fi
          # 0.50.0: publish the exact version + a rolling `nightly` pointer
          # (renamed from `latest`); the major/minor floats were dropped.
          # nightly moves on every build — it's the active channel, so it's
          # pushed unconditionally (no is_stable gate).
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          echo "Will tag image as:"
          echo "  ${IMAGE_NAME}:${VERSION}"
          echo "  ${IMAGE_NAME}:nightly"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # 0.50.0: push the exact version + a rolling `nightly` tag
          # (renamed from `latest`). No major/minor floats, no `latest`.
          # nightly is the active channel — it always moves to the newest
          # build, so deployments track `:nightly` instead of `:latest`.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }}
            ${{ env.IMAGE_NAME }}:nightly
          # Cache layers between runs. ignore-error on the export:
          # GHA's cache backend intermittently 404s blob writes
          # ("error writing layer blob: not_found"), and buildx fails
          # the WHOLE solve on a cache-export error — the v1.23.1
          # release build died at that step with the image fully
          # built but never pushed. The cache is an optimization;
          # losing one run's cache must not sink a release.
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          # Embed the version in image labels
          labels: |
            org.opencontainers.image.title=motif
            org.opencontainers.image.description=Automated theme orchestration for Plex via ThemerrDB
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Update Docker Hub description
        # v0.51.267: dropped `if: steps.tags.outputs.is_stable == 'true'`. That
        # output was retired at 0.50.0 when the stable/float tags went away (see
        # Compute tags: "pushed unconditionally (no is_stable gate)") but the
        # condition was left behind, so this step had been silently skipped on
        # EVERY release since. The description update is idempotent and already
        # non-fatal, so it just runs. test_v0_51_267 lints for the general class.
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: 'Automated Plex theme song orchestration via ThemerrDB'
          # v1.15.0: switched from README.md (33KB) to DOCKERHUB.md
          # (5KB). DockerHub's 25KB description limit was truncating
          # the full README mid-sentence on every release. The
          # GitHub-side README.md stays as-is for repo readers; the
          # DockerHub-side description is the focused short version
          # (deploy paths + first-time setup + link to repo for
          # everything else).
          readme-filepath: ./DOCKERHUB.md
