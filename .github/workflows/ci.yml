# v0.51.73: CI quality gate. Runs on every branch push + PR. NOT on tags — the
# tag build lives in release.yml, which since v0.51.267 runs its own blocking
# gate against the exact tagged source (the old "a branch push already ran
# this" rationale was a process assumption, not an enforcement).
#
# Three BLOCKING gates (a red run here means don't ship):
#   1. the full pytest suite (7,000+ tests, incl. the JS-syntax + mirror-drift guards)
#   2. ruff's pyflakes correctness rules minus 4 noise rules — clean today; this is
#      the rule family that caught the v0.51.72 httpx NameError.
#   3. pip-audit (v0.51.267 — dependency CVEs; was report-only, ratcheted to
#      blocking once measured clean)
# Two REPORT-ONLY signals (surfaced in the log, non-fatal until we ratchet):
#   full ruff lint and mypy. The report-only tier avoids a red wall on ~300
#   pre-existing style/type findings while still giving visibility; flip
#   individual ones to blocking as they're cleaned up.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches the Dockerfile runtime
          cache: pip
      - name: install deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      # v0.51.284: the audio-edit render tests need ffmpeg, and the runner
      # image does NOT ship it (verified: the v0.51.281 run skipped them —
      # the render path had never executed anywhere). MOTIF_REQUIRE_FFMPEG
      # turns a future silent skip into a hard failure.
      - name: install ffmpeg (render tests must RUN here, not skip)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: pytest — full suite (BLOCKING)
        run: PYTHONPATH=$PWD MOTIF_REQUIRE_FFMPEG=1 MOTIF_REQUIRE_NODE=1 pytest -q -p no:cacheprovider

  quality:
    name: lint + types + audit (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install tooling
        run: pip install -r requirements-dev.txt
      - name: ruff — pyflakes correctness (BLOCKING)
        run: ruff check app/ tests/ --select F --ignore F401,F811,F841,F541
      - name: ruff — full lint (report-only)
        run: ruff check app/ tests/ || true
      - name: mypy (report-only)
        run: mypy --ignore-missing-imports app/ || true
      # v0.51.267: BLOCKING. Measured clean at this commit ("No known
      # vulnerabilities found"), so the ratchet costs nothing today and a NEWLY
      # published CVE now turns CI red instead of scrolling past in a log. To
      # accept one, add `--ignore-vuln GHSA-xxxx` here WITH a rationale comment
      # — never restore `|| true`, which hides every finding including the next
      # unrelated one.
      - name: pip-audit — dependency CVEs (BLOCKING)
        run: pip-audit -r requirements.txt
